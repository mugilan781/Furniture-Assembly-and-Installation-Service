<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="assemblio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E" />
      <stop offset="45%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#76513C" />
    </linearGradient>
  </defs>
  <!-- Background rounded box with brass-to-walnut gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#assemblio-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <!-- Modular geometric installation grid mark matching ASSEMBLIO logo -->
  <g fill="none" stroke="#F7F3EB" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="13" y="13" width="16" height="16" rx="2.5" fill="#F7F3EB" />
    <rect x="35" y="13" width="16" height="16" rx="2.5" />
    <rect x="13" y="35" width="16" height="16" rx="2.5" />
    <rect x="35" y="35" width="16" height="16" rx="2.5" fill="#F7F3EB" />
  </g>
</svg>
