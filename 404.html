<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Page not found — ASSEMBLIO. The page you're looking for doesn't exist.">
  <title>404 — Page Not Found | ASSEMBLIO</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .error-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-primary); position:relative; overflow:hidden; }
    .error-bg-pattern { position:absolute; inset:0; background-image:repeating-linear-gradient(45deg,transparent,transparent 30px,rgba(176,141,87,0.02) 30px,rgba(176,141,87,0.02) 60px); pointer-events:none; }
    .error-number { font-family:var(--font-serif); font-size:clamp(8rem,20vw,18rem); line-height:1; color:transparent; -webkit-text-stroke:2px rgba(176,141,87,0.2); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); user-select:none; z-index:0; white-space:nowrap; }
    .error-content { position:relative; z-index:2; text-align:center; max-width:560px; padding:var(--space-6); }
    .error-icon { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,rgba(176,141,87,0.15),rgba(176,141,87,0.05)); border:1.5px solid rgba(176,141,87,0.2); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-6); }
    .search-wrap { display:flex; gap:var(--space-3); margin:var(--space-8) auto var(--space-8); max-width:360px; }
    .search-wrap input { flex:1; padding:0.875rem var(--space-5); border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--bg-secondary); color:var(--text-primary); font-family:var(--font-sans); font-size:var(--text-sm); outline:none; transition:border-color 0.2s; }
    .search-wrap input:focus { border-color:rgba(176,141,87,0.5); }
    .quick-links { display:flex; flex-wrap:wrap; gap:var(--space-3); justify-content:center; }
  </style>
</head>
<body>
  <main>
    <section class="error-page" aria-labelledby="error-heading">
      <div class="error-bg-pattern"></div>
      <div class="error-number" aria-hidden="true">404</div>

      <div class="error-content">
        <div class="error-icon" data-reveal="scale">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>

        <div class="badge badge-brass" style="margin-bottom:var(--space-5);" data-reveal="up">404 Error</div>
        <h1 id="error-heading" class="text-5xl tracking-tight" style="margin-bottom:var(--space-5);" data-reveal="up">
          This Page Has<br>Left the Building
        </h1>
        <p class="text-secondary text-base" style="line-height:1.7;margin-bottom:var(--space-6);" data-reveal="up" data-delay="100">
          The page you're looking for has been moved, renamed, or no longer exists. Don't worry — our team is much more reliable than this page.
        </p>

        <div class="search-wrap" data-reveal="up" data-delay="200">
          <input type="search" placeholder="Search our site..." aria-label="Search" id="err-search">
          <button class="btn btn-primary btn-sm" onclick="window.location='sitemap.html'" aria-label="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>

        <div class="quick-links" data-reveal="up" data-delay="300">
          <a href="index.html" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            Home
          </a>
          <a href="services.html" class="btn btn-secondary">Services</a>
          <a href="blog.html" class="btn btn-secondary">Blog</a>
          <a href="contact.html" class="btn btn-primary">Contact Us</a>
        </div>

        <p class="text-xs text-muted" style="margin-top:var(--space-8);" data-reveal="up" data-delay="400">
          Need help? Call us: <a href="tel:+442071234567" class="text-brass">+44 207 123 4567</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
